# Configuração do Nginx para servir o site 100% estático do "Dono do Capital"
# (gerado por `next build` com `output: 'export'` e `trailingSlash: true`).
#
# HTTP puro na porta 80 — sem TLS aqui de propósito. Termine SSL/TLS num proxy
# reverso na frente deste container (outro Nginx, Caddy, Traefik, load balancer
# da sua infra, etc.) e encaminhe para este container internamente via HTTP.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cada rota foi exportada como pagina/index.html (graças a trailingSlash: true
    # no next.config.mjs), então o `index` acima já resolve /, /simulador/,
    # /artigos/, etc. `try_files` cobre o caso de alguém acessar sem a barra final.
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Cache agressivo para os assets versionados pelo Next.js (hash no nome do
    # arquivo — podem ser cacheados "para sempre" com segurança).
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Favicon/ícones também recebem cache longo (nomes fixos, mas conteúdo raramente muda).
    location ~* \.(?:ico|svg|png)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
